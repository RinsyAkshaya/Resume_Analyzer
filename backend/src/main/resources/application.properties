spring.application.name=resume-analyser-backend
server.port=8080

# ---- MySQL (override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_analyser?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ---- File upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Analysis ----
# A candidate is shortlisted when Match Score >= this percentage
analysis.shortlist-threshold=50
